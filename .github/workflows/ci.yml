name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    # All three database types Moodle supports for this plugin run in every
    # build. MySQL rejects SQL that PostgreSQL and MariaDB accept (for example
    # a DELETE that selects from its own table, error 1093), so a green build
    # on one database alone says nothing about the others.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_401_STABLE'
            database: pgsql
          - php: '8.1'
            moodle-branch: 'MOODLE_401_STABLE'
            database: mysqli
          - php: '8.2'
            moodle-branch: 'MOODLE_404_STABLE'
            database: mariadb
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            database: pgsql
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            database: mysqli
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
            database: mysqli
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
            database: pgsql

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, zip, gd, intl, soap, curl, xml, dom
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Select database connection
        run: |
          case "${{ matrix.database }}" in
            pgsql)   echo "DB_USER=postgres" >> $GITHUB_ENV; echo "DB_PASS=postgres" >> $GITHUB_ENV; echo "DB_PORT=5432" >> $GITHUB_ENV ;;
            mysqli)  echo "DB_USER=root" >> $GITHUB_ENV; echo "DB_PASS=" >> $GITHUB_ENV; echo "DB_PORT=3306" >> $GITHUB_ENV ;;
            mariadb) echo "DB_USER=root" >> $GITHUB_ENV; echo "DB_PASS=" >> $GITHUB_ENV; echo "DB_PORT=3307" >> $GITHUB_ENV ;;
          esac

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-user "$DB_USER" \
            --db-pass "$DB_PASS" \
            --db-name moodle \
            --db-port "$DB_PORT" \
            --branch ${{ matrix.moodle-branch }} \
            --db-type ${{ matrix.database }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      # Warnings fail the build: the Plugins directory prechecks list them too.
      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      # All Grunt tasks (AMD build check, ESLint, Stylelint for every CSS file,
      # Gherkin lint), not only the AMD task.
      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Check for missing language strings
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: bash .github/scripts/check-lang-strings.sh

      - name: Check release package contents and size
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: bash .github/scripts/check-package.sh

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
